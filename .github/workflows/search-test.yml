name: Search Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  websearch-smoke:
    name: Web Search Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          if [ -z "${TAVILY_API_KEY:-}" ]; then
            echo "::error::Missing repository secret TAVILY_API_KEY"
            exit 1
          fi
          if [ -z "${MISTRAL_API_KEY:-}" ]; then
            echo "::error::Missing repository secret MISTRAL_API_KEY"
            exit 1
          fi

      - name: Run websearch examples
        env:
          ORCHESTRATOR: langgraph
          WEB_SEARCH_PROVIDER: tavily
          TAVILY_API_KEY: ${{ secrets.TAVILI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -euo pipefail

          run_query() {
            local query="$1"
            echo "Running query: $query"
            local output
            output="$(npm run --silent oneshot -- websearch --json -q "$query")"
            echo "$output" | node -e '
              const fs = require("fs");
              const raw = fs.readFileSync(0, "utf8").trim();
              const candidates = raw
                .split(/\r?\n/)
                .map((line) => line.trim())
                .filter(Boolean)
                .reverse();
              let parsed;
              let parseErrorMessage = "";
              for (const line of candidates) {
                const isJsonCandidate = line.startsWith("[") || line.startsWith("{");
                if (!isJsonCandidate) {
                  continue;
                }
                try {
                  parsed = JSON.parse(line);
                  break;
                } catch (error) {
                  parseErrorMessage ||= error instanceof Error ? error.message : String(error);
                }
              }
              if (parsed === undefined) {
                console.error(
                  `Expected valid JSON output from websearch.${parseErrorMessage ? ` Last parse error: ${parseErrorMessage}` : ""}`
                );
                process.exit(1);
              }
              if (!Array.isArray(parsed)) {
                console.error("Expected JSON array of search results.", parsed);
                process.exit(1);
              }
              if (parsed.length === 0) {
                console.error("Expected at least one search result.");
                process.exit(1);
              }
              for (const item of parsed.slice(0, 3)) {
                if (typeof item.title !== "string" || typeof item.link !== "string" || typeof item.snippet !== "string") {
                  console.error("Malformed search result:", item);
                  process.exit(1);
                }
              }
              console.log("Top websearch results:");
              parsed.slice(0, 3).forEach((item, index) => {
                console.log(`${index + 1}. ${item.title}`);
                console.log(`   ${item.link}`);
                console.log(`   ${item.snippet.replace(/\s+/g, " ").trim()}`);
              });
            '
          }

          run_query "Anthropic docs model context protocol"
          run_query "LangChain TypeScript agent loop example"
          run_query "GitHub Actions setup-node cache npm"

          echo "Running TS guidance scenario"
          guidance_output="$(npm run --silent oneshot -- agent --json -u 'Just plan: recommend SDK setup for this repository and include concrete web findings')"
          echo "$guidance_output" | node -e '
            const fs = require("fs");
            const raw = fs.readFileSync(0, "utf8").trim();
            const candidates = raw
              .split(/\r?\n/)
              .map((line) => line.trim())
              .filter(Boolean)
              .reverse();
            let parsed;
            for (const line of candidates) {
              if (!line.startsWith("{")) continue;
              try {
                parsed = JSON.parse(line);
                break;
              } catch {
                // keep scanning
              }
            }
            if (!parsed || typeof parsed.output !== "string") {
              console.error("Expected JSON output with string field: output");
              process.exit(1);
            }
            const output = parsed.output;
            if (!/(TypeScript|JavaScript|Node\\.js|npm)/i.test(output)) {
              console.error("Expected TS/JS/Node-oriented guidance in output.");
              process.exit(1);
            }
            if (/(\\bpip\\b|\\bpytest\\b|\\bapp\\.py\\b)/i.test(output)) {
              console.error("Unexpected Python-only setup guidance found in TS scenario.");
              process.exit(1);
            }
            console.log("TS guidance scenario passed.");
          '
